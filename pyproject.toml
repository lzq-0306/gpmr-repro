[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpmr-repro"
version = "1.0.0"
description = "Reproducible implementation of Graph Posterior Mass Rebalancing"
authors = [{name = "Zhengqi Liu"}]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "pandas>=2.1,<3", "ucimlrepo>=0.0.7,<1", "requests>=2.32,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lzq-0306/gpmr-repro"
Repository = "https://github.com/lzq-0306/gpmr-repro"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
figures = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
